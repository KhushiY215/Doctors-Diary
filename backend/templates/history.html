<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Saved Reports</title>
  <link href="https://fonts.googleapis.com/css2?family=Inika&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inika', serif;
      padding: 40px;
      background: #f0f2f5;
      color: #333;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .report-item {
      background: #fff;
      padding: 15px 20px;
      margin-bottom: 15px;
      border-left: 6px solid #4e73df;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .info {
      flex-grow: 1;
    }

    .info p {
      margin: 5px 0;
    }

    .actions button {
      margin-left: 10px;
      padding: 6px 12px;
      font-family: 'Inika', serif;
      background-color: #4e73df;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .sidebar {
      background-color: var(--sidebar-green);
      width: 250px;
      transition: width 0.3s ease;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 20px;
      box-sizing: border-box;
    }

    .sidebar.collapsed {
      width: 60px;
    }

    .toggle-btn {
      background: none;
      border: none;
      font-size: 24px;
      color: white;
      cursor: pointer;
      align-self: flex-start;
      margin-bottom: 30px;
    }

    .logo {
      font-family: 'Inspiration', cursive;
      font-size: 30px;
      color: white;
      margin-bottom: 40px;
      transition: opacity 0.3s, transform 0.3s;
      white-space: nowrap;
    }

    .sidebar.collapsed .logo,
    .sidebar.collapsed .nav-item span {
      opacity: 0;
      transform: scaleX(0);
      transition: opacity 0.3s, transform 0.3s;
    }

    .nav-item {
      color: white;
      font-size: 18px;
      padding: 10px 0;
      width: 100%;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .actions button:hover {
      background-color: #2e59d9;
    }
  </style>
</head>
<body>
   
  <h2>Saved Patient Reports</h2>
  <div id="reportList"></div>

  <script>
    const reports = JSON.parse(localStorage.getItem('savedReports') || '[]');
    const listDiv = document.getElementById('reportList');

    if (reports.length === 0) {
      listDiv.innerHTML = "<p>No saved reports found.</p>";
    } else {
      reports.forEach((report, index) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'report-item';

        wrapper.innerHTML = `
          <div class="info">
            <p><strong>Name:</strong> ${report.name}</p>
            <p><strong>Date:</strong> ${report.date}</p>
          </div>
          <div class="actions">
            <button onclick="viewReport(${index})">View</button>
            <button onclick="deleteReport(${index})">Delete</button>
          </div>
        `;
        listDiv.appendChild(wrapper);
      });
    }

    function viewReport(index) {
      const report = reports[index];
      const win = window.open('', '_blank');
      win.document.write(report.content);
    }
    function deleteReport(index) {
      if (confirm('Are you sure you want to delete this report?')) {
        reports.splice(index, 1);
        localStorage.setItem('savedReports', JSON.stringify(reports));
        location.reload();
      }
    }
  </script>
</body>
</html>
