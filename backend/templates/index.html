<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor's Notes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inika&family=Inspiration&display=swap" rel="stylesheet">
  <style>
    :root {
      --sidebar-green: #619769;
      --main-bg: #D9F9D1;
      --button-green: #51D05E;
      --card-gray: #D9D9D9;
      --text-dark: #1E1E1E;
    }

    body {
      margin: 0;
      font-family: 'Inika', serif;
      background-color: var(--main-bg);
      display: flex;
      height: 100vh;
      color: var(--text-dark);
    }

    .sidebar {
      background-color: var(--sidebar-green);
      width: 250px;
      transition: width 0.3s ease;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 20px;
      box-sizing: border-box;
    }

    .sidebar.collapsed {
      width: 60px;
    }

    .toggle-btn {
      background: none;
      border: none;
      font-size: 24px;
      color: white;
      cursor: pointer;
      align-self: flex-start;
      margin-bottom: 30px;
    }

    .logo {
      font-family: 'Inspiration', cursive;
      font-size: 30px;
      color: white;
      margin-bottom: 40px;
      transition: opacity 0.3s, transform 0.3s;
      white-space: nowrap;
    }

    .sidebar.collapsed .logo,
    .sidebar.collapsed .nav-item span {
      opacity: 0;
      transform: scaleX(0);
      transition: opacity 0.3s, transform 0.3s;
    }

    .nav-item {
      color: white;
      font-size: 18px;
      padding: 10px 0;
      width: 100%;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .main {
      flex-grow: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .main-container {
      max-width: 900px;
      margin: auto;
      background-color: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group select {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      background-color: var(--card-gray);
    }

    .buttons {
      display: flex;
      align-items: center;
      margin-top: 30px;
    }

    button {
      background-color: var(--button-green);
      color: white;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #3ca14a;
    }

    #result {
      margin-top: 25px;
      background-color: #f5f5f5;
      padding: 20px;
      border-radius: 10px;
    }

    .nav-item a {
      text-decoration: none;
      color: inherit;
      display: block;
      width: 100%;
    }

    @media (max-width: 768px) {
      .welcome-text {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
  <div class="logo">Doctor's Diary</div>
  <div class="nav-item"><a href="/">Home</a></div>
  <div class="nav-item"><a href="/history">History</a></div>
</div>

<div class="main">
  <div class="main-container">
    <h2>Patient Details</h2>
    <div class="form-grid">
      <div class="form-group">
        <label for="patientName">Name:</label>
        <input type="text" id="patientName" placeholder="Enter patient name" />
      </div>

      <div class="form-group">
        <label for="age">Age:</label>
        <input type="text" id="age" placeholder="Enter age" />
      </div>

      <div class="form-group">
        <label for="genderInput">Gender:</label>
        <select id="genderInput" required>
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="date">Date:</label>
        <input type="date" id="date" />
      </div>

      <div class="form-group">
        <label for="bp">Blood Pressure:</label>
        <input type="text" id="bp" placeholder="e.g., 120/80" />
      </div>

      <div class="form-group">
        <label for="cholesterol">Cholesterol Level:</label>
        <input type="text" id="cholesterol" placeholder="e.g., 180 mg/dL" />
      </div>
    </div>

    <div class="form-group" style="margin-top: 30px;">
      <label for="symptoms">Symptoms (comma-separated):</label>
      <input type="text" id="symptoms" placeholder="e.g., headache, fever, fatigue" />
    </div>

    <div class="buttons">
      <button id="diagnoseBtn">Diagnose</button>
      <button id="manualEntryBtn" style="margin-left: 10px;">Manual Entry</button>
      <button id="nextBtn" style="margin-left: auto;">Next ➔</button>
    </div>

    <!-- Manual Entry Form (hidden initially) -->
    <div id="manualEntryForm" class="manual-entry-form">
      <h3>Manual Diagnosis Entry</h3>
      <div class="form-group">
        <label for="manualDisease">Disease:</label>
        <input type="text" id="manualDisease" placeholder="Enter disease name" />
      </div>
      <div class="form-group">
        <label for="manualPrecautions">Precautions (comma-separated):</label>
        <textarea id="manualPrecautions" rows="3" placeholder="Enter precautions"></textarea>
      </div>
      <div class="form-group">
        <label for="manualPrescription">Prescription (comma-separated):</label>
        <textarea id="manualPrescription" rows="3" placeholder="Enter prescription"></textarea>
      </div>
      <button onclick="submitManualEntry()" style="margin-top: 15px;">Save Manual Diagnosis</button>
    </div>

    <div id="result" style="margin-top: 30px;"></div>
  </div>
</div>

<!-- Sidebar toggle -->
<script>
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('collapsed');
  }
</script>

<!-- Diagnose Button -->
<script>
  document.getElementById('diagnoseBtn').addEventListener('click', function () {
    const patientData = {
      name: document.getElementById('patientName').value,
      age: document.getElementById('age').value,
      gender: document.getElementById('genderInput').value,
      date: document.getElementById('date').value,
      bp: document.getElementById('bp').value,
      cholesterol: document.getElementById('cholesterol').value,
      symptoms: document.getElementById('symptoms').value.split(',').map(s => s.trim())
    };

    localStorage.setItem('patientInfo', JSON.stringify(patientData));

    fetch('/diagnose', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(patientData)
    })
    .then(response => response.json())
    .then(data => {
      if (data.error) {
        document.getElementById('result').innerHTML = `<p style="color:red;">${data.error}</p>`;
      } else {
        document.getElementById('result').innerHTML = `
          <h3>Diagnosis Result</h3>
          <p><strong>Disease:</strong> ${data.disease}</p>
          <p><strong>Precautions:</strong></p>
          <ul>${data.precautions.map(p => `<li>${p}</li>`).join('')}</ul>
          <p><strong>Prescription:</strong></p>
          <ul>${data.prescription.map(p => `<li>${p}</li>`).join('')}</ul>
        `;
      }
    })
    .catch(err => {
      console.error(err);
      document.getElementById('result').innerHTML = `<p style="color:red;">Error: ${err.message}</p>`;
    });
  });
</script>

<!-- Manual Entry Button -->
<script>
  document.getElementById('manualEntryBtn').addEventListener('click', function () {
    const form = document.getElementById('manualEntryForm');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
  });

  function submitManualEntry() {
    const disease = document.getElementById('manualDisease').value;
    const precautions = document.getElementById('manualPrecautions').value.split(',').map(p => p.trim());
    const prescription = document.getElementById('manualPrescription').value.split(',').map(p => p.trim());

    document.getElementById('result').innerHTML = `
      <h3>Manual Diagnosis Result</h3>
      <p><strong>Disease:</strong> ${disease}</p>
      <p><strong>Precautions:</strong></p>
      <ul>${precautions.map(p => `<li>${p}</li>`).join('')}</ul>
      <p><strong>Prescription:</strong></p>
      <ul>${prescription.map(p => `<li>${p}</li>`).join('')}</ul>
    `;

    localStorage.setItem('manualDiagnosis', JSON.stringify({ disease, precautions, prescription }));

    document.getElementById('manualEntryForm').style.display = 'none';
  }
</script>

<!-- Next Button -->
<script>
  document.getElementById('nextBtn').addEventListener('click', function () {
    const resultContent = document.getElementById('result').innerHTML.trim();
    if (!resultContent) {
      alert('Please diagnose or manually enter data first before proceeding.');
      return;
    }
    const diagnosisData = {
      htmlContent: resultContent
    };
    localStorage.setItem('diagnosisInfo', JSON.stringify(diagnosisData));
    window.location.href = '/print';
  });
</script>

</body>
</html>
